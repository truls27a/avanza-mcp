[project]
name = "avanza-mcp"
version = "0.1.0"
description = "MCP server for read-only Avanza account and market data, with BankID login (unofficial)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "avanza", "bankid", "investing", "chatgpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
authors = [
    { name = "Truls Borgvall" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28",
    "qrcode>=8.2",
]

[project.scripts]
avanza-mcp = "avanza_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
